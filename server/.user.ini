; Limiti PHP per-cartella: molti hosting condivisi (LiteSpeed/LSAPI, PHP-FPM)
; ignorano gli upload_max_filesize/post_max_size del php.ini globale ma
; rispettano un .user.ini nella webroot. Allineati al tetto configurato
; dall'app stessa (config.php -> max_upload_bytes, di default 200 MB):
; senza questo, un upload sotto quel tetto ma sopra il default
; dell'hosting (spesso 8-16 MB) fallisce con un errore fuorviante.
; Effetto non immediato: PHP rilegge questo file ogni user_ini.cache_ttl
; secondi (default 300).
upload_max_filesize = 200M
post_max_size = 200M
max_execution_time = 120
max_input_time = 120
